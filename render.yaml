services:
  - type: web
    name: seeds-store
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seeds-db
          property: connectionString

databases:
  - name: seeds-db
    databaseName: seeds
    user: seeds
